<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- 添加到主屏幕后的 App 样式配置 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="激战2小助手">
  <meta name="theme-color" content="#121418">
  <title>激战2 星岬岛手机导航</title>
  <style>
    :root {
      --bg: #121418;
      --card: #1c1f26;
      --card-active: #262a33;
      --text: #eef0f4;
      --muted: #8e95a5;
      --accent: #d9383a; /* 激战2经典红 */
      --gold: #e5b869;   /* 传奇金 */
      --border: #2a2e38;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 40px;
      line-height: 1.5;
    }
    /* 顶部固定栏 */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(18, 20, 24, 0.92);
      backdrop-filter: blur(10px);
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      background: var(--accent);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .home-btn {
      font-size: 13px;
      color: var(--gold);
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid rgba(229, 184, 105, 0.4);
      border-radius: 16px;
    }
    /* 搜索框 */
    .search-box {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    .search-box:focus { border-color: var(--gold); }
    .search-box::placeholder { color: var(--muted); }

    /* 分类标签栏 */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px 4px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      padding: 6px 14px;
      background: var(--card);
      color: var(--muted);
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }

    /* 内容区 */
    .container { padding: 12px 16px; }
    .section-title {
      font-size: 14px;
      color: var(--gold);
      font-weight: 600;
      margin: 16px 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-title:first-child { margin-top: 4px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 12px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: background 0.15s;
    }
    .card:active { background: var(--card-active); transform: scale(0.98); }
    .card-head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 600;
    }
    .card-desc {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
      font-size: 14px;
    }
    .footer-tip {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 28px;
      padding: 0 20px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <div class="title">
        <span>⚔️ 星岬岛快捷导航</span>
        <span class="badge">小队自用</span>
      </div>
      <a class="home-btn" href="https://gw2.wishingstarmoye.com/" target="_blank">原站首页 ↗</a>
    </div>
    <input type="text" id="searchInput" class="search-box" placeholder="搜索攻略、坐骑、日常、计时器..." />
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="all">全部</div>
    <div class="tab" data-cat="guide">热门攻略</div>
    <div class="tab" data-cat="tool">高频工具</div>
    <div class="tab" data-cat="db">数据库与配装</div>
  </div>

  <div class="container" id="content"></div>

  <div class="footer-tip">
    提示：点击浏览器菜单「添加到主屏幕」，即可像 App 一样全屏打开
  </div>

  <script>
    // 以后想加新攻略或微调具体子页面链接，直接改这里的数据即可
    const BASE = "https://gw2.wishingstarmoye.com/";
    const DATA = [
      // 热门攻略
      { cat: "guide", icon: "🐉", title: "坐骑攻略", desc: "飞天鳞龙 / 狮鹫 / 甲虫 / 乌龟", url: BASE },
      { cat: "guide", icon: "✨", title: "传奇装备制作", desc: "三代传奇 / 传奇饰品 / 护甲", url: BASE },
      { cat: "guide", icon: "🏃", title: "跳跳乐攻略", desc: "全地图跳跳乐路线与宝箱", url: BASE },
      { cat: "guide", icon: "⭐", title: "专精点获取", desc: "各资料片专精点速查", url: BASE },
      { cat: "guide", icon: "🎣", title: "钓鱼手册", desc: "全地图鱼类时间与鱼饵", url: BASE },
      { cat: "guide", icon: "⚒️", title: "副职业升级", desc: "裁缝 / 皮革 / 武器 / 厨师速冲", url: BASE },
      { cat: "guide", icon: "🎒", title: "实用收藏攻略", desc: "32格背包 / 饥饿的猫 / 沉没宝箱", url: BASE },
      { cat: "guide", icon: "🌱", title: "新手与80级向导", desc: "满级后做什么 / 装备获取", url: BASE },

      // 高频工具
      { cat: "tool", icon: "⏰", title: "事件时间表", desc: "全图大型突破与事件倒计时", url: BASE },
      { cat: "tool", icon: "👹", title: "BOSS 计时器", desc: "世界 BOSS 刷新时间提醒", url: BASE },
      { cat: "tool", icon: "📋", title: "日常清单", desc: "每日必做与巫师宝库参考", url: BASE },
      { cat: "tool", icon: "🗺️", title: "在线游戏地图", desc: "完整地图与细分点位查询", url: BASE },
      { cat: "tool", icon: "🔑", title: "代码生成器", desc: "游戏内物品/传送点代码生成", url: BASE },
      { cat: "tool", icon: "📢", title: "官方活动与平衡", desc: "国服活动 / 职业平衡预览", url: BASE },

      // 数据库与配装
      { cat: "db", icon: "🛡️", title: "BD 配装参考", desc: "各职业主流配装与循环", url: BASE },
      { cat: "db", icon: "📦", title: "物品与配方库", desc: "材料出处 / 神秘熔炉配方", url: BASE },
      { cat: "db", icon: "🏆", title: "成就数据库", desc: "按游戏风格检索成就攻略", url: BASE },
      { cat: "db", icon: "👗", title: "幻化分享", desc: "外观搭配与染料参考", url: BASE }
    ];

    const CAT_NAMES = {
      guide: "📖 热门图文攻略",
      tool: "🛠️ 高频实用工具",
      db: "📚 数据库与配装"
    };

    let currentCat = "all";
    let keyword = "";

    function render() {
      const container = document.getElementById("content");
      const filtered = DATA.filter(item => {
        const matchCat = currentCat === "all" || item.cat === currentCat;
        const matchKey = !keyword || (item.title + item.desc).toLowerCase().includes(keyword);
        return matchCat && matchKey;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty">没找到相关内容，试试换个关键词</div>`;
        return;
      }

      // 按分类分组渲染
      const groups = {};
      filtered.forEach(item => {
        if (!groups[item.cat]) groups[item.cat] = [];
        groups[item.cat].push(item);
      });

      let html = "";
      Object.keys(groups).forEach(cat => {
        html += `<div class="section-title">${CAT_NAMES[cat]}</div><div class="grid">`;
        groups[cat].forEach(item => {
          html += `
            <a class="card" href="${item.url}" target="_blank">
              <div class="card-head"><span>${item.icon}</span><span>${item.title}</span></div>
              <div class="card-desc">${item.desc}</div>
            </a>`;
        });
        html += `</div>`;
      });
      container.innerHTML = html;
    }

    // 绑定搜索与分类切换
    document.getElementById("searchInput").addEventListener("input", e => {
      keyword = e.target.value.trim().toLowerCase();
      render();
    });

    document.getElementById("tabs").addEventListener("click", e => {
      if (!e.target.classList.contains("tab")) return;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      e.target.classList.add("active");
      currentCat = e.target.dataset.cat;
      render();
    });

    render();
  </script>
</body>
</html>
