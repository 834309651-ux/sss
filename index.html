<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GW2 悬浮窗快捷面板</title>
  <style>
    :root {
      --bg: #0e1014;
      --panel: #161920;
      --panel-hover: #212631;
      --border: #2c313c;
      --gold: #d4af6a;
      --gold-dim: rgba(212, 175, 106, 0.25);
      --accent: #b8292b;
      --text: #e6e8ec;
      --muted: #7d8597;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: "Microsoft YaHei", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      overflow-x: hidden;
    }

    /* 极细暗黑滚动条 */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #333945; border-radius: 2px; }

    /* 顶部紧凑搜索栏 */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(14, 16, 20, 0.96);
      padding: 8px 10px 6px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .search-input {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    .search-input:focus { border-color: var(--gold); }
    .search-input::placeholder { color: var(--muted); }

    .btn-home {
      background: var(--panel);
      border: 1px solid var(--gold-dim);
      color: var(--gold);
      text-decoration: none;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      transition: 0.15s;
    }
    .btn-home:hover { background: var(--gold-dim); color: #fff; }

    /* 紧凑分类标签 */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      background: #12151b;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 4px 0;
      font-size: 12px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      transition: 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      background: rgba(184, 41, 43, 0.2);
      border-color: var(--accent);
      color: #ff6b6d;
      font-weight: 600;
    }

    /* 主内容区 */
    .main { padding: 8px 10px 20px; }

    .sec-title {
      font-size: 11px;
      color: var(--gold);
      margin: 10px 0 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.5px;
    }
    .sec-title:first-child { margin-top: 2px; }

    /* 紧凑双列按钮网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 8px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.12s;
      overflow: hidden;
    }
    .item:hover {
      background: var(--panel-hover);
      border-color: var(--gold-dim);
    }
    .item:active { transform: scale(0.97); }
    .item-icon { font-size: 14px; flex-shrink: 0; }
    .item-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    /* 一键复制代码标签 */
    .code-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .code-chip {
      background: #1a1d26;
      border: 1px dashed #3d4454;
      color: #c5cbd8;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
      transition: 0.15s;
    }
    .code-chip:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--panel-hover);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 24px 0;
      font-size: 12px;
    }

    /* 复制成功轻提示 */
    .toast {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--gold);
      color: #0e1014;
      font-weight: 600;
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 20px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
      z-index: 99;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="topbar">
    <input type="text" id="search" class="search-input" placeholder="🔍 搜索攻略 / 工具..." autocomplete="off">
    <a class="btn-home" href="https://gw2.wishingstarmoye.com/">星岬岛 ↗</a>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="all">全部</div>
    <div class="tab" data-cat="guide">攻略</div>
    <div class="tab" data-cat="tool">工具</div>
    <div class="tab" data-cat="db">数据库</div>
  </div>

  <div class="main">
    <!-- 常用游戏代码一键复制（可自行增删） -->
    <div class="sec-title">
      <span>⚡ 一键复制代码（点完直接进游戏 Ctrl+V）</span>
    </div>
    <div class="code-list" id="codeList"></div>

    <!-- 动态渲染的攻略/工具列表 -->
    <div id="content"></div>
  </div>

  <div class="toast" id="toast">已复制到剪贴板</div>

  <script>
    const BASE = "https://gw2.wishingstarmoye.com/";

    // 1. 常用传送点/配装代码（按你们小队习惯随便改）
    const QUICK_CODES = [
      { name: "狮子拱门", code: "[&BC0AAAA=]" },
      { name: "迷雾碎层入口", code: "[&BG8EAAA=]" },
      { name: "北方之眼", code: "[&BAkMAAA=]" },
      { name: "巫师塔", code: "[&BB8OAAA=]" },
      { name: "亭石", code: "[&BGUNAAA=]" }
    ];

    // 2. 导航按钮数据（把 url 换成具体子页面链接即可直达）
    const DATA = [
      // 攻略
      { cat: "guide", icon: "🐉", title: "坐骑攻略", url: BASE },
      { cat: "guide", icon: "✨", title: "传奇制作", url: BASE },
      { cat: "guide", icon: "🏃", title: "跳跳乐", url: BASE },
      { cat: "guide", icon: "⭐", title: "专精点", url: BASE },
      { cat: "guide", icon: "🎣", title: "钓鱼手册", url: BASE },
      { cat: "guide", icon: "⚒️", title: "副职升级", url: BASE },
      { cat: "guide", icon: "🎒", title: "实用收藏", url: BASE },
      { cat: "guide", icon: "🌱", title: "80级向导", url: BASE },

      // 工具
      { cat: "tool", icon: "⏰", title: "事件时间表", url: BASE },
      { cat: "tool", icon: "👹", title: "BOSS计时", url: BASE },
      { cat: "tool", icon: "📋", title: "日常清单", url: BASE },
      { cat: "tool", icon: "🗺️", title: "在线地图", url: BASE },
      { cat: "tool", icon: "🔑", title: "代码生成", url: BASE },
      { cat: "tool", icon: "📢", title: "官方活动", url: BASE },

      // 数据库
      { cat: "db", icon: "🛡️", title: "BD 配装", url: BASE },
      { cat: "db", icon: "📦", title: "物品配方", url: BASE },
      { cat: "db", icon: "🏆", title: "成就查询", url: BASE },
      { cat: "db", icon: "👗", title: "幻化分享", url: BASE }
    ];

    const CAT_NAMES = {
      guide: "📖 热门图文攻略",
      tool: "🛠️ 高频实用工具",
      db: "📚 数据库与配装"
    };

    let currentCat = "all";
    let keyword = "";
    let toastTimer = null;

    // 渲染一键复制区
    function renderCodes() {
      const el = document.getElementById("codeList");
      el.innerHTML = QUICK_CODES.map(c =>
        `<div class="code-chip" onclick="copyCode('${c.code}', '${c.name}')">${c.name}</div>`
      ).join("");
    }

    // 复制功能
    window.copyCode = function(code, name) {
      navigator.clipboard.writeText(code).then(() => {
        showToast(`已复制：${name} ${code}`);
      }).catch(() => {
        // 兼容旧内核的备用复制方案
        const input = document.createElement("input");
        input.value = code;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        document.body.removeChild(input);
        showToast(`已复制：${name}`);
      });
    };

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
    }

    // 渲染主网格
    function render() {
      const container = document.getElementById("content");
      const filtered = DATA.filter(item => {
        const matchCat = currentCat === "all" || item.cat === currentCat;
        const matchKey = !keyword || item.title.toLowerCase().includes(keyword);
        return matchCat && matchKey;
      });

      if (!filtered.length) {
        container.innerHTML = `<div class="empty">无匹配项</div>`;
        return;
      }

      const groups = {};
      filtered.forEach(item => {
        if (!groups[item.cat]) groups[item.cat] = [];
        groups[item.cat].push(item);
      });

      let html = "";
      Object.keys(groups).forEach(cat => {
        html += `<div class="sec-title"><span>${CAT_NAMES[cat]}</span></div><div class="grid">`;
        groups[cat].forEach(item => {
          html += `
            <a class="item" href="${item.url}">
              <span class="item-icon">${item.icon}</span>
              <span class="item-text">${item.title}</span>
            </a>`;
        });
        html += `</div>`;
      });
      container.innerHTML = html;
    }

    document.getElementById("search").addEventListener("input", e => {
      keyword = e.target.value.trim().toLowerCase();
      render();
    });

    document.getElementById("tabs").addEventListener("click", e => {
      if (!e.target.classList.contains("tab")) return;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      e.target.classList.add("active");
      currentCat = e.target.dataset.cat;
      render();
    });

    renderCodes();
    render();
  </script>
</body>
</html>
